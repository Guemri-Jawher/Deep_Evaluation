[project]
name = "agent-rag-eval"
version = "0.1.0"
description = "Deep Agents knowledge assistant with RAG, Langfuse observability and a full evaluation harness"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.23",
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-text-splitters>=1.0",
    "langgraph>=1.0",
    "langchain-chroma>=1.0",
    "chromadb>=1.0",
    "fastembed>=0.5",
    "pypdf>=5.0",
    "langfuse>=3.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "tenacity>=9.0",
    "typer>=0.12",
    "deepeval>=4.3.1",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
]

[project.scripts]
kb = "assistant.cli:app"
kb-eval = "evals.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant", "src/evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "eval: LLM-backed evaluation (needs OPENROUTER_API_KEY, slow, rate limited)",
    "retrieval: retrieval-only evaluation (local embeddings, no LLM)",
]
addopts = "-m 'not eval' -q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# E501: the formatter owns line length. B008: typer's documented Option() default idiom.
# UP047: TypeVar-style generics are fine and mypy-friendly.
ignore = ["E501", "B008", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["assistant", "evals"]
ignore_missing_imports = true
